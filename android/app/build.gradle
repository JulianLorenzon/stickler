apply plugin: 'com.android.application'

android {
    namespace "com.julianlorenzon.stickler"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.julianlorenzon.stickler"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 6
        versionName "1.2.2"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // The optimized test build shares the debug build's name ("Stickler dev")
    sourceSets { optimized { res.srcDirs += 'src/debug/res' } }

    buildTypes {
        // A test build for the phone: own app ID and name ("Stickler dev"), so it installs next to the Play version
        // without replacing it; signed with the SDK's debug key, no password. Its labels are separate from the
        // Play version's. Build: tools/android-build/run.sh dev
        debug {
            applicationIdSuffix ".dev"
            versionNameSuffix "-dev"
            // Shrunk like the release, but without R8's optimisations (it skips them for debuggable builds), so it
            // doesn't catch everything R8 breaks: test the optimized build below before a release. -Pnoshrink builds it
            // unshrunk, for readable Android-side stack traces while hunting a bug
            if (!project.hasProperty("noshrink")) {
                minifyEnabled true
                shrinkResources true
                proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            }
        }
        release {
            // R8 shrinks the APK from 4.7 to 2.5 MB. It crashed on connect in October 2026; with today's
            // Capacitor and plugins a shrunk test build (see debug) connected, printed on both printers,
            // took a shared picture, exported a label and handled back (2026-11-14). The bundle carries the
            // mapping file, so Play shows crash stack traces with the real names
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // No signingConfig: the release APK comes out unsigned and tools/sign-release.sh signs it with your
            // release key, asking for the password, so the password is never stored anywhere
        }
        // The release build as a test build: R8's full optimisation like the release (debug skips it, being
        // debuggable, and 1.2.1 crashed at start only in the optimised build), but "Stickler dev" next to the Play
        // version, signed with the debug key. No WebView inspection, as in the release.
        // Build: tools/android-build/run.sh dev optimized
        optimized {
            initWith release
            applicationIdSuffix ".dev"
            versionNameSuffix "-dev"
            signingConfig signingConfigs.debug
            matchingFallbacks = ['release']
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'
